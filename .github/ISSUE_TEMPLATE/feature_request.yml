name: Feature request
description: Suggest a reusable feature, widget, or workflow
title: "feature: "
body:
  - type: markdown
    attributes:
      value: |
        Propose something other projects built from this starter would reuse. A one-off screen for a private app belongs in that app.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this, and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behavior you want. Mention whether it belongs in core, shared, or a feature.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered, including doing nothing.
  - type: checkboxes
    id: scope
    attributes:
      label: Expected scope
      options:
        - label: New reusable widget
        - label: New screen
        - label: New feature module
        - label: CLI command
        - label: Documentation only
