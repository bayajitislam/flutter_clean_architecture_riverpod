name: flutter_clean_architecture_riverpod
description: Feature-first clean architecture Flutter starter with Riverpod
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.6
  flutter_devlog: ^0.3.0
  remixicon: ^4.9.3
  material_ui: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  args: ^2.7.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  yaml: ^3.1.4
  analyzer: ^10.2.0

executables:
  fcar: fcar

flutter:
  uses-material-design: true
